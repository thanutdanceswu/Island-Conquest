<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Island Conquest Promo - Auto Load from public/</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09131c;
      color: #fff;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 14px;
    }
    .stage-box {
      width: 100%;
      max-width: 1080px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(255, 211, 42, 0.35);
      background: #000;
    }
    canvas { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; }
    .controls {
      width: 100%;
      max-width: 1080px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    button {
      font-family: 'Kanit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover { transform: translateY(-2px); }
    .btn-play { background: linear-gradient(135deg, #00d2ff, #0097e6); color: #fff; }
    .btn-rec { background: linear-gradient(135deg, #ff4757, #ff6b81); color: #fff; }
    .btn-rec.recording { animation: recPulse 1s infinite; }
    @keyframes recPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,71,87,0.8); }
      50% { box-shadow: 0 0 0 12px rgba(255,71,87,0); }
    }
    .status-list {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      font-size: 13px;
      color: #a4b0be;
    }
    .badge { padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.08); }
    .badge.ok { color: #0be881; border: 1px solid rgba(11,232,129,0.4); }
    .badge.miss { color: #ffa502; border: 1px solid rgba(255,165,2,0.4); }
    .main-status { width: 100%; text-align: center; font-size: 14px; color: #ffd32a; }
  </style>
</head>
<body>

  <div class="stage-box">
    <canvas id="stage" width="1280" height="720"></canvas>
  </div>

  <div class="controls">
    <button class="btn-play" id="btnPlay">▶ เล่นแอนิเมชั่น</button>
    <button class="btn-rec" id="btnRec">🔴 บันทึกเป็นคลิป (.webm)</button>
    <div class="main-status" id="mainStatus">กำลังโหลดไฟล์จริงจากโฟลเดอร์ public/ ...</div>
    <div class="status-list" id="assetStatus"></div>
  </div>

<script>
// ==================== ตั้งค่ารายชื่อไฟล์จริงในโฟลเดอร์ public/ ====================
// คุณสามารถเพิ่มชื่อไฟล์การ์ดอื่นๆ หรือเปลี่ยนพาธตรงนี้ได้เลยครับ
const CONFIG = {
  boardPath: './img/board.jpg',
  bgmPath: './audio/bgm.mp3',
  cardPaths: [
    './cards/kickOut.webp',
    './cards/shield.webp'
    // ตัวอย่างถ้ามีการ์ดเพิ่ม ให้ใส่ต่อด้านล่าง:
    // './cards/swap.webp',
    // './cards/steal.webp'
  ],
  siteUrl: 'iscq.vercel.app'
};

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;
const DURATION = 28.0; // ความยาวรวม 28 วินาที

const mainStatus = document.getElementById('mainStatus');
const assetStatus = document.getElementById('assetStatus');
const btnPlay = document.getElementById('btnPlay');
const btnRec = document.getElementById('btnRec');

const assets = {
  board: null,
  cards: [],
  bgmRaw: null,
  bgmBuffer: null
};

// ==================== AUTO-LOAD ASSETS FROM public/ ====================
function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve({ ok: true, img, src });
    img.onerror = () => resolve({ ok: false, img: null, src });
    img.src = src;
  });
}

async function preloadAllAssets() {
  const badges = [];

  // 1. Board Image
  const bRes = await loadImage(CONFIG.boardPath);
  if (bRes.ok) {
    assets.board = bRes.img;
    badges.push(`<span class="badge ok">✓ ${CONFIG.boardPath}</span>`);
  } else {
    badges.push(`<span class="badge miss">⚠ ไม่พบ ${CONFIG.boardPath}</span>`);
  }

  // 2. Cards Images
  for (const path of CONFIG.cardPaths) {
    const cRes = await loadImage(path);
    if (cRes.ok) {
      assets.cards.push({ img: cRes.img, name: path.split('/').pop().replace(/\.[^/.]+$/, '') });
      badges.push(`<span class="badge ok">✓ ${path}</span>`);
    } else {
      badges.push(`<span class="badge miss">⚠ ไม่พบ ${path}</span>`);
    }
  }

  // 3. BGM Audio
  try {
    const res = await fetch(CONFIG.bgmPath);
    if (res.ok) {
      assets.bgmRaw = await res.arrayBuffer();
      badges.push(`<span class="badge ok">✓ ${CONFIG.bgmPath}</span>`);
    } else {
      badges.push(`<span class="badge miss">⚠ ไม่พบ ${CONFIG.bgmPath}</span>`);
    }
  } catch (e) {
    badges.push(`<span class="badge miss">⚠ โหลด ${CONFIG.bgmPath} ไม่ได้ (ควรเปิดผ่าน Local Server)</span>`);
  }

  assetStatus.innerHTML = badges.join('');
  mainStatus.textContent = 'พร้อมใช้งานแล้ว! กด "เล่นแอนิเมชั่น" หรือ "บันทึกเป็นคลิป (.webm)" ได้เลยครับ';
  renderFrame(8.5);
}

// ==================== AUDIO ENGINE ====================
let audioCtx = null, masterGain = null, audioDest = null, bgmNode = null;
let mediaRecorder = null, recordedChunks = [];

async function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.85;
    audioDest = audioCtx.createMediaStreamDestination();
    masterGain.connect(audioCtx.destination);
    masterGain.connect(audioDest);
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (assets.bgmRaw && !assets.bgmBuffer) {
    try {
      assets.bgmBuffer = await audioCtx.decodeAudioData(assets.bgmRaw.slice(0));
    } catch (e) {}
  }
}

function startBGM() {
  stopBGM();
  if (!assets.bgmBuffer) return;
  bgmNode = audioCtx.createBufferSource();
  bgmNode.buffer = assets.bgmBuffer;
  bgmNode.loop = true;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.01, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.55, audioCtx.currentTime + 0.8);
  bgmNode.connect(g);
  g.connect(masterGain);
  bgmNode.start();
}

function stopBGM() {
  if (bgmNode) {
    try { bgmNode.stop(); } catch (e) {}
    bgmNode = null;
  }
}

function playPop(freq = 640) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq * 0.7, now);
  osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.08);
  g.gain.setValueAtTime(0.28, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
  osc.connect(g); g.connect(masterGain);
  osc.start(now); osc.stop(now + 0.15);
}

function playChime() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = n;
    g.gain.setValueAtTime(0.001, now + i * 0.07);
    g.gain.linearRampToValueAtTime(0.18, now + i * 0.07 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.35);
    osc.connect(g); g.connect(masterGain);
    osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.4);
  });
}

// ==================== HELPERS & EFFECTS ====================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const confetti = Array.from({ length: 85 }, (_, i) => ({
  x: Math.random() * W,
  y: -Math.random() * 500,
  vy: 130 + Math.random() * 140,
  size: 7 + Math.random() * 8,
  color: ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#ffffff'][i % 6],
  rot: Math.random() * Math.PI * 2
}));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawKenBurns(img, zoom, panX, panY, blur = 0) {
  ctx.save();
  if (blur > 0) ctx.filter = `blur(${blur}px) brightness(0.42)`;
  const ir = img.width / img.height, cr = W / H;
  let dw, dh;
  if (ir > cr) { dh = H * zoom; dw = dh * ir; }
  else { dw = W * zoom; dh = dw / ir; }
  ctx.drawImage(img, (W - dw) / 2 + panX, (H - dh) / 2 + panY, dw, dh);
  ctx.restore();
}

function drawBanner(text, y, progress) {
  const p = easeOutBack(clamp(progress, 0, 1));
  if (p <= 0) return;
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.scale(p, p);
  ctx.font = '800 26px Kanit, sans-serif';
  const bw = Math.min(W - 80, ctx.measureText(text).width + 58);
  ctx.fillStyle = 'rgba(9, 18, 30, 0.85)';
  ctx.strokeStyle = '#ffd32a';
  ctx.lineWidth = 3;
  roundRect(-bw / 2, -26, bw, 52, 26);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 2);
  ctx.restore();
}

function drawSubtitle(text) {
  ctx.save();
  ctx.font = '600 23px Kanit, sans-serif';
  const bw = Math.min(W - 80, ctx.measureText(text).width + 50);
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  roundRect(W / 2 - bw / 2, H - 68, bw, 46, 12);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H - 44);
  ctx.restore();
}

function drawDice(x, y, size, rot, pips) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
  const g = ctx.createLinearGradient(-size/2, -size/2, size/2, size/2);
  g.addColorStop(0, '#fffdf5'); g.addColorStop(1, '#e6dcc5');
  ctx.fillStyle = g;
  roundRect(-size/2, -size/2, size, size, size * 0.22);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#cbbba0'; ctx.lineWidth = 3; ctx.stroke();

  ctx.fillStyle = '#d63031';
  const o = size * 0.25, r = size * 0.095;
  const map = {
    1: [[0,0]], 2: [[-o,-o],[o,o]], 3: [[-o,-o],[0,0],[o,o]],
    4: [[-o,-o],[o,-o],[-o,o],[o,o]], 5: [[-o,-o],[o,-o],[0,0],[-o,o],[o,o]],
    6: [[-o,-o],[o,-o],[-o,0],[o,0],[-o,o],[o,o]]
  };
  (map[pips] || map).forEach(([px, py]) => {
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

function drawCardPop(cardObj, x, y, targetH, scale, rot, shinePhase) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(scale, scale);

  const ratio = cardObj ? (cardObj.img.width / cardObj.img.height) : 0.7;
  const ch = targetH;
  const cw = ch * clamp(ratio, 0.55, 1.3);

  ctx.shadowColor = 'rgba(255, 211, 42, 0.7)';
  ctx.shadowBlur = 32; ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#ffd32a';
  roundRect(-cw/2 - 6, -ch/2 - 6, cw + 12, ch + 12, 18);
  ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  ctx.save();
  roundRect(-cw/2, -ch/2, cw, ch, 14);
  ctx.clip();
  if (cardObj) {
    ctx.drawImage(cardObj.img, -cw/2, -ch/2, cw, ch);
  } else {
    ctx.fillStyle = '#ff4757';
    ctx.fillRect(-cw/2, -ch/2, cw, ch);
    ctx.fillStyle = '#fff';
    ctx.font = '800 24px Kanit, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CARD', 0, 0);
  }

  // Foil Shine Sweep
  const sx = lerp(-cw * 1.2, cw * 1.2, shinePhase % 1);
  const shine = ctx.createLinearGradient(sx - 40, -ch/2, sx + 40, ch/2);
  shine.addColorStop(0, 'rgba(255,255,255,0)');
  shine.addColorStop(0.5, 'rgba(255,255,255,0.45)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(-cw/2, -ch/2, cw, ch);
  ctx.restore();
  ctx.restore();
}

// ==================== SCENES ====================

// ฉาก 1 (0 - 8s): ฉากที่ 2 จากสคริปต์ — เล่นง่ายใน 10 วิ & เลือกมาสคอต 4 ตัว
function renderSceneJoinMascots(t) {
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#00a8ff');
  bg.addColorStop(0.55, '#00d2d3');
  bg.addColorStop(1, '#1e3799');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Browser Card Center
  const p = easeOutBack(clamp(t / 0.7, 0, 1));
  ctx.save();
  ctx.translate(W / 2, H * 0.49);
  ctx.scale(p, p);

  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 35;
  ctx.fillStyle = '#ffffff';
  roundRect(-450, -205, 900, 410, 24);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Browser Header
  ctx.fillStyle = '#1e272e';
  roundRect(-450, -205, 900, 52, 24);
  ctx.fill();
  ctx.fillRect(-450, -175, 900, 22);
  ['#ff5e57', '#ffdd59', '#0be881'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(-418 + i * 24, -179, 7, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#2f3640';
  roundRect(-240, -193, 480, 28, 14); ctx.fill();
  ctx.fillStyle = '#0be881';
  ctx.font = '700 16px Kanit, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`🔒  https://${CONFIG.siteUrl}  •  สร้างห้องส่งลิงก์ทันที`, 0, -174);

  // 4 Mascots Selection
  ctx.fillStyle = '#1e272e';
  ctx.font = '800 30px Kanit, sans-serif';
  ctx.fillText('เลือกสัตว์ทะเลคู่ใจของคุณ (2 - 4 คน)', 0, -108);

  const mascots = [
    { emoji: '🐙', name: 'ปลาหมึก', color: '#ff4757', delay: 0.7 },
    { emoji: '🐬', name: 'โลมา', color: '#00d2d3', delay: 1.4 },
    { emoji: '🐢', name: 'เต่า', color: '#1dd1a1', delay: 2.1 },
    { emoji: '🦭', name: 'แมวน้ำ', color: '#feca57', delay: 2.8 }
  ];

  mascots.forEach((m, i) => {
    const mx = -300 + i * 200;
    const mp = easeOutBack(clamp((t - m.delay) / 0.5, 0, 1));
    const bob = Math.sin(t * 5 + i) * 6;
    ctx.save();
    ctx.translate(mx, 28 + bob);
    ctx.scale(mp, mp);

    ctx.fillStyle = '#f8f9fa';
    ctx.strokeStyle = m.color;
    ctx.lineWidth = 4;
    roundRect(-80, -95, 160, 195, 20);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.arc(0, -25, 48, 0, Math.PI * 2); ctx.fill();
    ctx.font = '54px sans-serif';
    ctx.fillText(m.emoji, 0, -8);

    ctx.fillStyle = '#2f3542';
    ctx.font = '800 22px Kanit, sans-serif';
    ctx.fillText(m.name, 0, 55);

    ctx.fillStyle = '#10ac84';
    ctx.font = '600 15px Kanit, sans-serif';
    ctx.fillText('✓ พร้อมยกพล!', 0, 82);
    ctx.restore();
  });
  ctx.restore();

  drawBanner('🚀 ไม่ต้องโหลดแอพ • สร้างห้อง ส่งลิงก์ เล่นได้ทันที (2-4 คน)', 52, t / 0.6);
  drawSubtitle('แค่เปิดเบราว์เซอร์ กดสร้างห้อง แชร์ลิงก์ให้เพื่อน 2-4 คน แล้วเลือกสัตว์ทะเลคู่ใจยกพลขึ้นเกาะได้เลย!');
}

// ฉาก 2 (8 - 15s): ฉากกระดานจริง board.jpg (Ken Burns Pan & Zoom + ลูกเต๋า 3D)
function renderSceneBoard(t) {
  const lt = t - 8.0;
  const p = clamp(lt / 7.0, 0, 1);

  if (assets.board) {
    drawKenBurns(assets.board, lerp(1.06, 1.32, easeOutCubic(p)), lerp(-60, 50, p), lerp(35, -35, p), 0);
  } else {
    ctx.fillStyle = '#0c2461'; ctx.fillRect(0, 0, W, H);
  }

  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, W*0.65);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

  // 3D Dice Rolling
  if (lt > 0.8) {
    const dt = clamp((lt - 0.8) / 1.4, 0, 1);
    const bounce = Math.abs(Math.sin(dt * Math.PI * 3)) * (1 - dt) * 145;
    const spin = (1 - easeOutCubic(dt)) * Math.PI * 5;
    const p1 = dt < 0.85 ? (Math.floor(lt * 16) % 6) + 1 : 6;
    const p2 = dt < 0.85 ? (Math.floor(lt * 20) % 6) + 1 : 5;
    drawDice(lerp(-120, W * 0.42, easeOutCubic(dt)), H * 0.56 - bounce, 110, spin - 0.15, p1);
    drawDice(lerp(-180, W * 0.58, easeOutCubic(dt)), H * 0.52 - bounce * 0.85, 110, -spin + 0.2, p2);
  }

  drawBanner('🎲 ทอยเต๋า วางแผนเดินหมาก ยึดเกาะกลางทะเล!', 52, lt / 0.6);
  drawSubtitle('เปิดศึกวางแผนเรียลไทม์บนกระดานจริง ชิงไหวชิงพริบทุกการเดินหมาก!');
}

// ฉาก 3 (15 - 22s): ฉากการ์ดจริงจาก public/cards/ (kickOut.webp, shield.webp ฯลฯ)
function renderSceneCards(t) {
  const lt = t - 15.0;

  if (assets.board) {
    drawKenBurns(assets.board, 1.18, 0, 0, 14);
  } else {
    ctx.fillStyle = '#192a56'; ctx.fillRect(0, 0, W, H);
  }

  const list = assets.cards.length ? assets.cards : [null, null];
  const n = list.length;
  const spreadW = Math.min(820, (n - 1) * 320);

  list.forEach((card, i) => {
    const delay = 0.25 + i * 0.65;
    const p = easeOutBack(clamp((lt - delay) / 0.6, 0, 1));
    const cx = n === 1 ? W / 2 : (W / 2 - spreadW / 2) + (i / (n - 1)) * spreadW;
    const floatY = Math.sin(t * 3.8 + i) * 12;
    const rot = n === 1 ? 0 : ((i - (n - 1) / 2) * 0.1);
    const ch = n <= 2 ? 410 : 340;
    drawCardPop(card, cx, H * 0.50 + floatY, ch, p, rot, lt * 0.55 + i * 0.3);
  });

  drawBanner('🃏 การ์ดสกิล & การ์ดแกล้งเพื่อนสุดป่วน พลิกเกมได้ทุกเทิร์น!', 52, lt / 0.6);
  drawSubtitle('ใช้การ์ดจริงอย่าง Kick Out หรือ Shield ป้องกันและป่วนเพื่อนให้สุดมันส์!');
}

// ฉาก 4 (22 - 28s): ฉากที่ 6 Outro & Call to Action (iscq.vercel.app) + Confetti ฉลองชัยชนะ
function renderSceneOutro(t) {
  const lt = t - 22.0;

  if (assets.board) {
    drawKenBurns(assets.board, lerp(1.08, 1.2, lt / 6.0), 0, 0, 12);
  } else {
    const g = ctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, 700);
    g.addColorStop(0, '#0097e6'); g.addColorStop(1, '#09131c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // Confetti Celebration Shower
  confetti.forEach(c => {
    const cy = ((c.y + lt * c.vy) % (H + 100)) - 40;
    const cx = (c.x + Math.sin(t * 2.5 + c.rot) * 45 + W) % W;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(c.rot + t * 4);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.restore();
  });

  // Real cards flanking left/right
  if (assets.cards.length >= 1) {
    const p = easeOutBack(clamp(lt / 0.7, 0, 1));
    drawCardPop(assets.cards, 195, H * 0.52, 290, p, -0.18, lt * 0.7);
    drawCardPop(assets.cards[assets.cards.length > 1 ? 1 : 0], W - 195, H * 0.52, 290, p, 0.18, lt * 0.7 + 0.5);
  }

  // Center CTA
  const cp = easeOutBack(clamp(lt / 0.7, 0, 1));
  const pulse = 1 + Math.sin(t * 8) * 0.04;
  ctx.save();
  ctx.translate(W / 2, H * 0.36);
  ctx.scale(cp, cp);

  ctx.font = '900 54px Kanit, sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#09131c';
  ctx.strokeText('🌊 รวมแก๊งเปิดตี้ได้แล้ววันนี้!', 0, 0);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('🌊 รวมแก๊งเปิดตี้ได้แล้ววันนี้!', 0, 0);

  // URL Pill Button
  ctx.translate(0, 118);
  ctx.scale(pulse, pulse);
  const g = ctx.createLinearGradient(-260, 0, 260, 0);
  g.addColorStop(0, '#ff6b6b');
  g.addColorStop(0.5, '#ff9f43');
  g.addColorStop(1, '#feca57');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(255, 159, 67, 0.65)';
  ctx.shadowBlur = 28;
  roundRect(-275, -42, 550, 84, 42);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.font = '900 36px Kanit, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  ctx.fillText(`👉 ${CONFIG.siteUrl} (เล่นฟรีบนเว็บ)`, 0, 2);
  ctx.restore();

  drawSubtitle(`ศึกชิงเกาะเปิดรอคุณอยู่ ชวนแก๊งเพื่อนมาร่วมตี้ได้แล้ววันนี้ เข้าเล่นฟรีได้เลยที่ ${CONFIG.siteUrl}!`);
}

// ==================== MAIN LOOP & RECORDING ====================
let isPlaying = false, isRecording = false, startTime = 0, rafId = null;
const fired = new Set();

function handleSFX(t) {
  const once = (id, time, fn) => { if (t >= time && !fired.has(id)) { fired.add(id); fn(); } };
  once('m1', 0.7, () => playPop(520));
  once('m2', 1.4, () => playPop(600));
  once('m3', 2.1, () => playPop(680));
  once('m4', 2.8, () => playPop(760));
  once('dice1', 9.0, () => playPop(440));
  once('dice2', 9.5, () => playPop(560));
  once('card1', 15.3, () => playPop(650));
  once('card2', 16.0, () => playPop(780));
  once('outro', 22.1, () => playChime());
}

function renderFrame(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < 8.0) renderSceneJoinMascots(t);
  else if (t < 15.0) renderSceneBoard(t);
  else if (t < 22.0) renderSceneCards(t);
  else renderSceneOutro(t);

  // Flash Cut Transitions
  [8.0, 15.0, 22.0].forEach(cut => {
    const d = Math.abs(t - cut);
    if (d < 0.22) {
      ctx.fillStyle = `rgba(255,255,255,${(1 - d / 0.22) * 0.75})`;
      ctx.fillRect(0, 0, W, H);
    }
  });

  // Progress Bar
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(0, H - 5, W, 5);
  ctx.fillStyle = '#ffd32a';
  ctx.fillRect(0, H - 5, W * clamp(t / DURATION, 0, 1), 5);
}

function loop(now) {
  if (!isPlaying) return;
  const t = (now - startTime) / 1000;
  handleSFX(t);
  renderFrame(t);
  mainStatus.textContent = isRecording
    ? `🔴 กำลังบันทึกวิดีโอ... ${t.toFixed(1)} / ${DURATION} วินาที`
    : `▶ กำลังเล่น... ${t.toFixed(1)} / ${DURATION} วินาที`;

  if (t < DURATION) rafId = requestAnimationFrame(loop);
  else stopAll(true);
}

async function startPlay() {
  await initAudio();
  stopAll(false);
  fired.clear();
  startBGM();
  isPlaying = true;
  startTime = performance.now();
  rafId = requestAnimationFrame(loop);
}

function stopAll(finished) {
  isPlaying = false;
  if (rafId) cancelAnimationFrame(rafId);
  stopBGM();
  if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
    isRecording = false;
    btnRec.classList.remove('recording');
    btnRec.textContent = '🔴 บันทึกเป็นคลิป (.webm)';
  }
  if (finished) mainStatus.textContent = '✅ จบคลิปเรียบร้อยแล้วครับ!';
}

async function startRecord() {
  await initAudio();
  recordedChunks = [];
  const stream = new MediaStream([
    ...canvas.captureStream(60).getVideoTracks(),
    ...audioDest.stream.getAudioTracks()
  ]);
  let opts = { mimeType: 'video/webm;codecs=vp9,opus' };
  if (!MediaRecorder.isTypeSupported(opts.mimeType)) opts = { mimeType: 'video/webm' };

  mediaRecorder = new MediaRecorder(stream, opts);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Island_Conquest_Promo.webm';
    a.click();
    URL.revokeObjectURL(url);
    mainStatus.textContent = '🎉 ดาวน์โหลดคลิป Island_Conquest_Promo.webm สำเร็จแล้ว!';
  };

  isRecording = true;
  btnRec.classList.add('recording');
  btnRec.textContent = '⏹ กำลังอัดคลิป (รอจนครบ 28 วิ)...';
  mediaRecorder.start();
  await startPlay();
}

btnPlay.addEventListener('click', () => { if (!isRecording) startPlay(); });
btnRec.addEventListener('click', () => {
  if (isRecording) { stopAll(false); mainStatus.textContent = 'ยกเลิกการบันทึกแล้ว'; }
  else startRecord();
});

preloadAllAssets();
</script>
